name: build-portable

# 便携版自动构建。
#
# 触发：push 到 main，或手动 dispatch。
# 产物：Artifacts 里的两个包（依赖框架版 + 自包含版）。
#       包由 upload-artifact 自己压缩，解压一次即得一个顶层文件夹，内部不再套 zip。
# 保留：只保留最新一次构建，旧的 artifact 在构建成功后被删除。
#
# Release 通道：构建成功后由 release job 把同内容的两个 zip 上传到固定 Release
#   （tag = env.RELEASE_TAG，永远只有这一个），用户从 Release 页下载 —— Actions
#   Artifact 的下载速度太慢。该 Release 始终标记为 pre-release，不参与 Latest 徽标，
#   不会与正式版 Release 混淆；release job 全程只操作这一个 tag，其它 Release 一概不碰。
#   资产用固定名，每次构建由 gh release upload --clobber 同名替换，Release 页永远只有一份最新构建；
#   tag 也随每次构建强制移到最新 commit，源码快照与资产始终同源。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-portable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # build 只读；release 要写 Release（contents: write）；cleanup 要删 artifact（actions: write）。
  contents: write
  actions: write

env:
  CONFIGURATION: Release
  RUNTIME: win-x64
  # 唯一允许被 CI 更新的 Release tag。绝不改成 v* 之类的正式版本 tag。
  RELEASE_TAG: ci-latest

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: framework
            self_contained: "false"
            dist: DSH-Desktop-Webview
            folder: DSH Desktop Webview
          - mode: selfcontained
            self_contained: "true"
            dist: DSH-Desktop-Webview-with-net
            folder: DSH Desktop Webview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve short sha
        shell: pwsh
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          "SHA_SHORT=$short" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "短 sha = $short"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\nuget-packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build (0 warnings gate)
        env:
          NUGET_PACKAGES: ${{ runner.temp }}\nuget-packages
        run: dotnet build DSH-Desktop-Webview.sln -c $env:CONFIGURATION --nologo

      - name: Test
        env:
          NUGET_PACKAGES: ${{ runner.temp }}\nuget-packages
        run: dotnet test DSH-Desktop-Webview.sln -c $env:CONFIGURATION --nologo

      - name: Publish portable (${{ matrix.mode }})
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ runner.temp }}\nuget-packages
        run: |
          $sc = if ("${{ matrix.self_contained }}" -eq "true") { "true" } else { "false" }
          dotnet publish src/DshDesktop.App/DshDesktop.App.csproj `
            -c $env:CONFIGURATION -r $env:RUNTIME --self-contained $sc `
            -o "artifacts/${{ matrix.mode }}" --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 退出码 $LASTEXITCODE" }

      - name: Verify artifact (${{ matrix.mode }})
        shell: pwsh
        run: |
          $out = "artifacts/${{ matrix.mode }}"
          $exe = Join-Path $out "DSH-Desktop-Webview.exe"
          if (-not (Test-Path $exe)) { throw "缺少 $exe" }

          $sdkNet = @(Get-ChildItem -Path $out -Recurse -Filter "Microsoft.Windows.SDK.NET.dll")
          if ($sdkNet.Count -eq 0) {
            throw "产物缺少 Microsoft.Windows.SDK.NET.dll —— 合成宿主会初始化失败并回退到 hwnd"
          }

          # CI 产物必须是「纯程序」：运行期数据只会在用户机器上生成。
          foreach ($name in @("config.json", "run.log", "WebView2Profile", "temp")) {
            if (Test-Path (Join-Path $out $name)) { throw "产物里混入了运行期数据: $name" }
          }

          # 自包含版必须真的带上运行时，否则目标机会直接报「找不到 .NET 运行时」。coreclr.dll 是运行时本体。
          if ("${{ matrix.self_contained }}" -eq "true") {
            if (-not (Test-Path (Join-Path $out "coreclr.dll"))) {
              throw "自包含版缺少 coreclr.dll —— 运行时没有真正打进产物"
            }
          }

          $total = (Get-ChildItem -Path $out -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host ("OK: {0:N1} MB / {1} 个文件" -f ($total / 1MB), (Get-ChildItem -Path $out -Recurse -File).Count)

      - name: Stage portable folder (${{ matrix.mode }})
        shell: pwsh
        run: |
          # 用户下载到的压缩包由 upload-artifact 生成（它总会打一层 zip）。若我们自己先压成
          # zip 再上传，用户就会拿到「zip 里套 zip」，必须解压两次才能看到 exe。
          #
          # 所以这里只做目录整理、不产生任何 zip：内容搬进与交付同名的一层文件夹，交给
          # upload-artifact 压缩。解压时它只剥掉自己那层壳，顶层就是 'DSH Desktop Webview'。
          $stage = "stage/${{ matrix.folder }}"
          if (Test-Path "stage") { Remove-Item "stage" -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "artifacts/${{ matrix.mode }}/*" -Destination $stage -Recurse -Force

          # 自检：待打包目录里不能有 zip（那就是「压缩包里还是压缩包」，正是要杜绝的形态）。
          $nested = @(Get-ChildItem -Path $stage -Recurse -File -Filter "*.zip")
          if ($nested.Count -gt 0) {
            throw "待打包目录里混入了 zip，会出现「压缩包里套压缩包」: $($nested.Name -join ', ')"
          }

          $total = (Get-ChildItem -Path $stage -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host ("OK: 已就绪 {0:N1} MB / {1} 个文件，顶层文件夹 '{2}'" -f `
            ($total / 1MB), (Get-ChildItem -Path $stage -Recurse -File).Count, "${{ matrix.folder }}")

      - name: Upload artifact (${{ matrix.mode }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dist }}-${{ env.SHA_SHORT }}
          # 只传文件夹本身：upload-artifact 会把它作为压缩包的唯一顶层目录（不带 /* 就不会平铺）。
          path: stage/${{ matrix.folder }}
          # upload-artifact 默认丢弃以 . 开头的隐藏文件；产物里必须一个不少。
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  release:
    # 只有构建（含测试与产物校验）全部成功才发布；失败时保留 artifact 供排查，Release 不动。
    needs: build
    if: success()
    runs-on: windows-latest

    steps:
      # 按名字取回两个 artifact：内容与现在用户从 Actions 下载的完全一致
      # （顶层是与交付同名的一层文件夹，不套多余 zip 壳）。
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          # 只取 build job 上传的两个 artifact（按前缀匹配），其它分支/工作流的产物不碰。
          pattern: DSH-Desktop-Webview*
          path: release-assets
          # 每个 artifact 解到自己的子目录（<dist>-<短sha>），与下面 Package zips 的取用名一致。
          merge-multiple: false

      - name: Package zips
        shell: pwsh
        run: |
          # artifact 目录名 = upload-artifact 的 name = 'dist-短sha'。GITHUB_ENV 不跨 job，
          # 所以这里用同一个 github.sha 重算短 sha（与 cleanup job 的做法一致）。
          $short = "${{ github.sha }}".Substring(0, 7)
          # zip 用固定名：每次构建同名替换，Release 页永远只有一份最新构建，下载链接稳定。
          $map = @{
            "DSH-Desktop-Webview.zip"          = "DSH-Desktop-Webview-$short"
            "DSH-Desktop-Webview-with-net.zip" = "DSH-Desktop-Webview-with-net-$short"
          }

          New-Item -ItemType Directory -Path "zips" -Force | Out-Null

          foreach ($zip in $map.Keys) {
            $dir = Join-Path "release-assets" $map[$zip]
            if (-not (Test-Path $dir)) { throw "缺少 artifact 目录: $dir" }

            # 自检：待打包目录里不能有 zip，否则用户会拿到「压缩包里套压缩包」。
            $nested = @(Get-ChildItem -Path $dir -Recurse -File -Filter "*.zip" -Force)
            if ($nested.Count -gt 0) {
              throw "待打包目录里混入了 zip: $($nested.Name -join ', ')"
            }

            # zip 内部结构必须与 Actions artifact 一致：顶层只有一层 'DSH Desktop Webview'
            # 文件夹。注意 download-artifact 解出的是 release-assets/<artifact名>/，它内部
            # 才是 'DSH Desktop Webview'，所以这里拷的是 $dir 的子项（不能把 $dir 整个拷成
            # 顶层文件夹，否则用户要解两层同名文件夹才能看到 exe）。
            # 显式列出子项（含隐藏）再逐个拷，避免 * 通配符悄悄丢掉隐藏文件。
            if (Test-Path "zipstage") { Remove-Item "zipstage" -Recurse -Force }
            $stageDir = "zipstage/DSH Desktop Webview"
            New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
            Get-ChildItem -Path $dir -Force | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $stageDir -Recurse -Force
            }

            $dest = "zips/$zip"
            if (Test-Path $dest) { Remove-Item $dest -Force }
            # 不用 Compress-Archive：它的通配符枚举会漏掉隐藏文件（PowerShell Archive 的
            # 老牌问题）。ZipFile::CreateFromDirectory 按 .NET 目录枚举打包，一个文件都
            # 不少，与 upload-artifact include-hidden-files 的口径一致。
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::CreateFromDirectory("zipstage", $dest)
            Remove-Item "zipstage" -Recurse -Force

            $size = (Get-Item $dest).Length
            if ($size -le 0) { throw "$zip 为空文件" }
            Write-Host ("OK: {0} = {1:N1} MB" -f $zip, ($size / 1MB))
          }

      # 全流程只认 env.RELEASE_TAG 这一个 tag：不存在则创建（预发布）；存在则把 tag 强制
      # 移到本次 commit，并同名替换资产。其它 Release（正式版等）全程不被读取、不被修改。
      - name: Update fixed pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag  = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "RELEASE_TAG 为空，拒绝发布" }
          # 第一道防呆：RELEASE_TAG 必须是滚动 tag，绝不接受正式版本号形态（v1.2.3 / 1.2.3）。
          # 滚动 tag 用固定名（ci-latest），正式发版走别的流程，本 job 只允许操作滚动预发布。
          if ($tag -match '^v?\d+\.\d+\.\d+') {
            throw "RELEASE_TAG='$tag' 看起来像正式版本号，拒绝发布 —— 本 job 只发布滚动预发布"
          }
          # $assets 是本地文件路径，$names 是上传后在 Release 页显示的资产名，一一对应。
          $assets = @(
            "zips/DSH-Desktop-Webview.zip",
            "zips/DSH-Desktop-Webview-with-net.zip"
          )
          $names = @("DSH-Desktop-Webview.zip", "DSH-Desktop-Webview-with-net.zip")

          $short  = "${{ github.sha }}".Substring(0, 7)
          $when   = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm 'UTC'")
          $notes  = "CI 滚动构建（预发布，非正式版本）。`n`n提交: ${{ github.sha }}（$short）`n构建时间: $when`n`n资产为固定名，每次构建覆盖。"

          # release 是否已存在
          $exists = $false
          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $exists = $true }

          if (-not $exists) {
            # 第二道防呆：tag 必须「尚不存在」或「本仓库自己的轻量 tag」。
            # 轻量 tag 由 gh release create 创建（直接指向 commit）；注解 tag（object.type=tag、
            # 指向 tag 对象）多半来自正式发版流程 —— 绝不允许 CI 首次创建时就套在正式版本 tag 上。
            $tagRef = gh api "repos/$repo/git/ref/tags/$tag" 2>$null | ConvertFrom-Json
            if ($LASTEXITCODE -eq 0) {
              if ($tagRef.object.type -ne "commit") {
                throw "tag '$tag' 是注解 tag（object.type=$($tagRef.object.type)），疑似正式版本 tag，拒绝创建 Release —— 请确认 RELEASE_TAG 没被改成正式版本 tag"
              }
              # 本仓库自己的轻量 tag（滚动流程残留：Release 被删但 tag 还在）→ 放行：
              # 先把它挪到本次 commit，再让 gh release create 挂到这个现有 tag 上。
              Write-Host "tag '$tag' 已存在且是本仓库的轻量 tag，先移到本次 commit 再复用"
              gh api -X PATCH "repos/$repo/git/refs/tags/$tag" `
                -f sha="${{ github.sha }}" -F force=true | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "移动 tag '$tag' 到本次 commit 失败: $LASTEXITCODE" }
            }

            Write-Host "创建固定预发布 Release: $tag"
            # --target 让 tag 落在本次构建的 commit 上（dispatch 到非默认分支时也不会指错）。
            # tag 已由上面 PATCH 挪好时，gh release create 直接复用它，不再新建。
            gh release create $tag `
              --repo $repo `
              --target "${{ github.sha }}" `
              --prerelease `
              --title "CI Latest (预发布)" `
              --notes $notes | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "gh release create 失败: $LASTEXITCODE" }
          } else {
            # 已存在：刷新标题/描述（含预发布标记），并把 tag 强制移到本次 commit ——
            # 这是滚动发布的语义：资产同名替换（见下方 --clobber），源码快照也跟着走。
            # PATCH git/ref 只作用于 ci-latest 这一个 ref，其它 tag / Release 一概不碰。
            gh release edit $tag --repo $repo --prerelease --title "CI Latest (预发布)" --notes $notes | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "gh release edit 失败: $LASTEXITCODE" }

            # 移动 tag 必须带 force=true（tag 不允许非快进移动）；-F 让 gh 把它发成布尔值。
            # 若 tag 已在本次 commit（同一 run 重跑），这是无操作，照样成功。
            gh api -X PATCH "repos/$repo/git/refs/tags/$tag" `
              -f sha="${{ github.sha }}" -F force=true | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "移动 tag '$tag' 到本次 commit 失败: $LASTEXITCODE" }

            Write-Host "已存在 Release '$tag'，tag 已移到本次 commit，准备用 --clobber 覆盖同名资产。"
          }

          # —— 直接用 upload --clobber 上传，不再先 delete-asset ——
          # --clobber 在资产已存在时自动替换、不存在时直接新建，两种情况一条命令搞定。
          # 原来「先 delete 后 upload」反而有竞态：删除后上传若失败，Release 会缺资产。
          foreach ($a in $assets) {
            if (-not (Test-Path $a)) { throw "缺少待上传文件: $a" }
            gh release upload $tag $a --repo $repo --clobber | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "gh release upload $a 失败: $LASTEXITCODE" }
            Write-Host "已上传: $a"
          }

          # 终检：Release 必须仍是预发布（不抢 Latest 徽标），且两个资产都在。
          $info = gh release view $tag --repo $repo --json isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "gh release view 失败: $LASTEXITCODE" }
          if (-not $info.isPrerelease) { throw "Release '$tag' 不是预发布状态 —— 拒绝继续" }
          $got = @($info.assets | ForEach-Object { $_.name })
          foreach ($n in $names) {
            if ($n -notin $got) { throw "Release 缺少资产: $n" }
          }
          Write-Host ("OK: {0} 为预发布，资产齐全: {1}" -f $tag, ($got -join ', '))

  cleanup:
    needs: build
    if: success()
    runs-on: windows-latest

    steps:
      # 只保留最新一次构建。用 runner 预装的 gh CLI，避免再引一个第三方 action 当供应链依赖。
      - name: Delete older artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"

          # 短 sha 重新算一遍：与 build job 用的是同一个 github.sha，结果必然一致。
          $env:SHA_SHORT = "${{ github.sha }}".Substring(0, 7)

          # 本次构建的两个包都算「当前」，都要留。名字必须与 build job 的 upload-artifact
          # 完全一致，否则会把刚上传的产物当「旧的」删掉；cleanup 与 build 无法共享 matrix，
          # 所以这里只能重写一遍 —— release job 的打包步骤也依赖这套命名，改动时几处都要改。
          if ([string]::IsNullOrWhiteSpace($env:SHA_SHORT)) {
            throw "SHA_SHORT 为空，拒绝清理 —— 否则会把刚上传的产物全部误删"
          }
          $current = @(
            "DSH-Desktop-Webview-$env:SHA_SHORT",
            "DSH-Desktop-Webview-with-net-$env:SHA_SHORT"
          )

          $json = gh api "repos/$repo/actions/artifacts?per_page=100" | ConvertFrom-Json
          $stale = @($json.artifacts | Where-Object { $_.name -notin $current })

          if ($stale.Count -eq 0) {
            Write-Host "没有需要清理的旧 artifact。"
            exit 0
          }

          foreach ($a in $stale) {
            Write-Host ("删除旧 artifact: {0} (id={1}, 创建于 {2})" -f $a.name, $a.id, $a.created_at)
            gh api -X DELETE "repos/$repo/actions/artifacts/$($a.id)" | Out-Null
          }
          Write-Host ("已清理 {0} 个旧 artifact。" -f $stale.Count)
